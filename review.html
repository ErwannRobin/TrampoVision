<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title data-i18n="rv.title">TrampoVision review</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --panel: #fff;
        --ink: #1a1a1a;
        --muted: #6b6b66;
        --line: #dcdcd6;
        --accent: #1f5eff;
        --accent-soft: #e6edff;
        --ok: #12833b;
        --ok-soft: #e2f4e8;
        --warn: #b26b00;
        --warn-soft: #fbeed7;
        --bad: #b3261e;
        --bad-soft: #fbe5e3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --panel: #1e1e1e;
          --ink: #ececea;
          --muted: #9a9a94;
          --line: #333;
          --accent: #6f9bff;
          --accent-soft: #1d2a4a;
          --ok: #4cc27a;
          --ok-soft: #173424;
          --warn: #e0a24a;
          --warn-soft: #3a2c14;
          --bad: #ff7b72;
          --bad-soft: #3d1c1a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.4 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        /* The review is one screen: the header on top, the work below. Nothing on the page itself scrolls. */
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      body.out {
        overflow: auto;
      }
      [hidden] {
        display: none !important;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---- top bar ---- */
      header {
        flex: none;
        z-index: 5;
        display: flex;
        gap: 8px 16px;
        align-items: center;
        flex-wrap: wrap;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .back {
        text-decoration: none;
        font-weight: 600;
        padding: 6px 10px;
        margin-left: -10px;
        border-radius: 8px;
      }
      .back:hover {
        background: var(--bg);
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      #tabs {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-right: auto;
      }
      #tabs button {
        font: inherit;
        color: var(--muted);
        background: none;
        border: 1px solid transparent;
        border-radius: 99px;
        padding: 5px 12px;
        cursor: pointer;
      }
      #tabs button:hover {
        border-color: var(--line);
      }
      #tabs button[aria-selected='true'] {
        color: var(--ink);
        background: var(--accent-soft);
        border-color: var(--accent);
        font-weight: 600;
      }
      #tabs .n {
        margin-left: 4px;
        font-variant-numeric: tabular-nums;
      }
      body.out #tabs,
      body.out #who {
        display: none;
      }
      #lang {
        font: inherit;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
      }
      body.out #lang {
        margin-left: auto;
      }

      /* ---- layout ---- */
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 12px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }
      #detail {
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #stage {
        flex: 1;
        min-height: 0;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      /* The two side panels (the jumps, the figure picker) sit beside the jump on wide screens and cover it, on demand, on narrow ones. */
      .sheetclose,
      .sheetopen {
        display: none;
      }
      @media (max-width: 1099px) {
        #list,
        #side {
          display: none;
          position: fixed;
          inset: 0;
          z-index: 20;
          overflow: auto;
          border-radius: 0;
          border: 0;
          padding: 12px 14px 20px;
          background: var(--bg);
        }
        #list {
          background: var(--panel);
        }
        body.listopen #list {
          display: block;
        }
        body.fixopen #side {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .sheetclose {
          display: block;
          position: sticky;
          top: 0;
          margin: 0 0 8px auto;
          align-self: flex-end;
          z-index: 1;
        }
        .sheetopen {
          display: inline-block;
        }
        ul.queue {
          max-height: none !important;
        }
      }
      @media (min-width: 1100px) {
        main {
          grid-template-columns: 250px minmax(0, 1fr);
        }
        #list {
          display: flex;
          flex-direction: column;
          min-height: 0;
          padding: 8px;
        }
        ul.queue {
          flex: 1;
          min-height: 0;
        }
        #detail {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 340px;
          grid-template-rows: auto minmax(0, 1fr) auto;
          gap: 10px 12px;
        }
        #detail > #answer {
          grid-column: 1;
        }
        #detail > #stage {
          grid-column: 1;
        }
        #detail > .bar {
          grid-column: 1;
        }
        #detail > #side {
          grid-column: 2;
          grid-row: 1 / span 3;
          min-height: 0;
          overflow: auto;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
      }

      /* ---- list ---- */
      ul.queue {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: auto;
      }
      ul.queue li button {
        display: grid;
        grid-template-columns: 10px 1fr;
        gap: 4px 10px;
        align-items: center;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }
      ul.queue li button:hover {
        background: var(--bg);
      }
      ul.queue li button[aria-current='true'] {
        background: var(--accent-soft);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line);
      }
      .dot.auto {
        background: var(--accent);
      }
      .dot.confirmed {
        background: var(--ok);
      }
      .dot.corrected {
        background: var(--warn);
      }
      .dot.unknown,
      .dot.bad-data {
        background: var(--bad);
      }
      .li-name {
        font-weight: 550;
        line-height: 1.25;
      }
      .li-sub {
        grid-column: 2;
        margin-top: -2px;
      }

      /* ---- answer: one slim strip ---- */
      .answer {
        display: flex;
        align-items: center;
        gap: 6px 16px;
        flex-wrap: wrap;
        padding: 8px 12px;
      }
      .answer h2 {
        margin: 0 0 2px;
        font-size: 11px;
      }
      .a-main {
        flex: 1 1 260px;
        min-width: 0;
      }
      .a-title {
        display: flex;
        align-items: center;
        gap: 4px 10px;
        flex-wrap: wrap;
      }
      #autoname {
        font-size: 20px;
        font-weight: 650;
        line-height: 1.2;
      }
      .tag {
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 99px;
        border: 1px solid var(--line);
      }
      .tag.confident {
        color: var(--ok);
      }
      .tag.probable {
        color: var(--accent);
      }
      .tag.tentative {
        color: var(--warn);
      }
      .tag.unclassified {
        color: var(--bad);
      }
      #verdictnow {
        padding: 1px 10px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 550;
        background: var(--bg);
      }
      #verdictnow.confirmed {
        background: var(--ok-soft);
        color: var(--ok);
      }
      #verdictnow.corrected {
        background: var(--warn-soft);
        color: var(--warn);
      }
      #verdictnow.unknown,
      #verdictnow.bad-data {
        background: var(--bad-soft);
        color: var(--bad);
      }
      #ident {
        text-align: right;
        font-size: 12px;
      }
      /* What the classifier measured, small. */
      .facts {
        display: flex;
        gap: 6px;
      }
      .fact {
        background: var(--bg);
        border-radius: 8px;
        padding: 2px 10px;
        line-height: 1.25;
      }
      .fact span {
        display: block;
        font-size: 11px;
      }
      .fact b {
        display: block;
        font-size: 14px;
      }

      /* ---- the jump: a big skeleton you can move around, and slim curves under it ---- */
      #stage {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
      }
      .viewport {
        position: relative;
        flex: 1;
        min-height: 140px;
        border-radius: 8px;
        overflow: hidden;
        background: var(--bg);
      }
      canvas {
        display: block;
      }
      #skel {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
      }
      #skel.grabbing {
        cursor: grabbing;
      }
      #views {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px;
        max-width: calc(100% - 170px);
      }
      #views button {
        padding: 4px 9px;
        font-size: 13px;
      }
      #views button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      #viewhint {
        position: absolute;
        right: 10px;
        bottom: 6px;
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
        text-align: right;
        max-width: 60%;
      }
      @media (hover: none) {
        #viewhint {
          display: none;
        }
      }
      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .controls button {
        padding: 5px 14px;
        min-width: 76px;
      }
      #curves {
        width: 100%;
        height: 78px;
        flex: none;
        cursor: ew-resize;
        touch-action: none;
      }
      @media (max-height: 640px) {
        #curves {
          display: none;
        }
      }

      /* ---- fix: pick another figure ---- */
      button.act,
      input[type='text'] {
        font: inherit;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
      }
      button.act {
        cursor: pointer;
      }
      button.act:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
        font-weight: 650;
      }
      button.primary:hover:not(:disabled) {
        border-color: var(--ok);
        filter: brightness(1.08);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #cands {
        display: grid;
        gap: 6px;
      }
      #cands button {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 10px;
        align-items: center;
        text-align: left;
        padding: 9px 12px;
      }
      kbd {
        font:
          12px/1 ui-monospace,
          monospace;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 5px;
        background: var(--bg);
        color: var(--muted);
      }
      .builder {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 12px;
        align-items: center;
        margin-top: 12px;
      }
      .builder .lab {
        color: var(--muted);
        font-size: 13px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chips button {
        min-width: 44px;
        padding: 7px 12px;
      }
      .chips button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      #savepick {
        margin-top: 12px;
        width: 100%;
      }

      /* ---- action bar ---- */
      .bar {
        z-index: 4;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .bar #confirm {
        padding: 10px 20px;
        font-size: 15px;
      }
      .bar #skip {
        margin-left: auto;
      }
      .bar #confirm {
        flex: 1 1 100%;
        order: -1;
      }
      #err:empty {
        display: none;
      }
      #note {
        width: 100%;
      }
      #side > .card {
        flex: none;
      }
      @media (max-width: 1099px) {
        .bar #skip {
          margin-left: 0;
        }
        .bar .act {
          flex: 1 1 auto;
          padding: 8px 10px;
        }
      }
      @media (max-width: 900px) {
        header h1 {
          display: none;
        }
        header {
          padding: 6px 12px;
        }
        #tabs {
          order: 5;
          flex: 1 1 100%;
          flex-wrap: nowrap;
          overflow-x: auto;
          margin-right: 0;
        }
        #tabs button {
          white-space: nowrap;
        }
        #who {
          flex: 1;
          min-width: 0;
        }
      }
      @media (max-width: 700px) {
        #ident,
        #autoclf {
          display: none;
        }
        .answer {
          padding: 6px 10px;
        }
        #autoname {
          font-size: 17px;
        }
        main {
          padding: 8px;
          gap: 8px;
        }
        .bar {
          padding: 8px;
        }
        .bar .act {
          font-size: 13px;
        }
      }
      @media (hover: none) {
        kbd {
          display: none;
        }
        #cands button {
          grid-template-columns: 1fr auto;
        }
      }
      #err {
        color: var(--bad);
        margin: 0;
      }
      #toast {
        position: fixed;
        left: 50%;
        top: 64px;
        transform: translateX(-50%);
        z-index: 10;
        padding: 10px 18px;
        border-radius: 99px;
        background: var(--ink);
        color: var(--bg);
        font-weight: 550;
        width: max-content;
        max-width: 90vw;
        text-align: center;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        margin: 0;
      }
      .hints {
        margin: 0;
      }
      .hints kbd {
        margin-left: 6px;
      }
    </style>
  </head>
  <body class="out">
    <header>
      <a class="back" href="/" data-i18n="rv.home">← Home</a>
      <h1 data-i18n="rv.heading">Review jumps</h1>
      <div id="tabs" role="tablist" aria-label="Which jumps" data-i18n-attr="aria-label:rv.tabs"></div>
      <input
        id="who"
        type="text"
        placeholder="Your name"
        size="12"
        aria-label="Your name"
        data-i18n-attr="placeholder:rv.who;aria-label:rv.who"
      />
      <select id="lang" aria-label="Language" data-i18n-attr="aria-label:rv.language"></select>
    </header>

    <section id="login" class="card" style="margin: 16px; max-width: 420px">
      <h2 data-i18n="rv.unavailable">Review unavailable</h2>
      <p id="loginerr" class="muted"></p>
      <a href="/" data-i18n="rv.backHome">Back to the home page</a>
    </section>

    <main id="app" hidden>
      <aside id="list" class="card" aria-label="Jumps" data-i18n-attr="aria-label:rv.jumps">
        <button class="act sheetclose" id="listclose" type="button" data-i18n="rv.close">Close</button>
        <h2 id="listtitle">To review</h2>
        <ul class="queue" id="queue"></ul>
        <p id="empty" class="muted" hidden>Nothing here. All done!</p>
      </aside>

      <div id="detail" hidden>
        <section class="card answer" id="answer" aria-label="Automatic answer" data-i18n-attr="aria-label:rv.auto">
          <div class="a-main">
            <h2 id="progress">Automatic answer</h2>
            <div class="a-title">
              <span id="autoname"></span>
              <span id="autotag" class="tag"></span><span id="autoconf" class="muted"></span
              ><span id="autoclf" class="muted"></span>
              <span id="verdictnow" hidden></span>
            </div>
          </div>
          <div class="facts" id="measured"></div>
          <div class="muted" id="ident"></div>
        </section>

        <section class="card" id="stage" aria-label="The jump" data-i18n-attr="aria-label:rv.theJump">
          <div class="viewport" id="viewport">
            <canvas
              id="skel"
              aria-label="3D skeleton replay"
              data-i18n-attr="aria-label:rv.skeleton;title:rv.viewHint"
            ></canvas>
            <div id="views" role="group" aria-label="View" data-i18n-attr="aria-label:rv.views">
              <button class="act" id="resetview" type="button" data-i18n="rv.resetView" disabled>Reset view</button>
              <button class="act" type="button" data-view="side" aria-pressed="false" data-i18n="rv.viewSide">
                Side
              </button>
              <button class="act" type="button" data-view="top" aria-pressed="false" data-i18n="rv.viewTop">Top</button>
              <button
                class="act"
                id="vup"
                type="button"
                aria-pressed="false"
                data-i18n="rv.viewUpright"
                data-i18n-attr="title:rv.viewUprightHint"
              >
                Upright
              </button>
            </div>
            <span id="viewhint" data-i18n="rv.viewHint"></span>
          </div>
          <div class="controls">
            <button class="act" id="play" type="button">Play</button>
            <input
              id="scrub"
              type="range"
              min="0"
              max="1"
              step="0.001"
              value="0"
              style="flex: 1"
              aria-label="Position in the jump"
              data-i18n-attr="aria-label:rv.position"
            />
          </div>
          <canvas id="curves" aria-label="Measured curves" data-i18n-attr="aria-label:rv.curves"></canvas>
        </section>

        <div class="bar" role="group" aria-label="Verdict" data-i18n-attr="aria-label:rv.verdictGroup">
          <button class="act sheetopen" id="listopen" type="button" data-i18n="rv.jumps">Jumps</button>
          <button
            class="act"
            id="prev"
            type="button"
            aria-label="Previous jump"
            title="Previous (←)"
            data-i18n-attr="aria-label:rv.previous;title:rv.previousTitle"
          >
            ←
          </button>
          <button class="act primary" id="confirm" type="button"></button>
          <button
            class="act"
            id="unknown"
            type="button"
            title="Cannot tell (U)"
            data-i18n-attr="title:rv.cannotTellTitle"
          >
            <span data-i18n="rv.cannotTell">Cannot tell</span> <kbd>U</kbd>
          </button>
          <button class="act" id="baddata" type="button" title="Bad data (B)" data-i18n-attr="title:rv.badDataTitle">
            <span data-i18n="rv.badData">Bad data</span> <kbd>B</kbd>
          </button>
          <button class="act sheetopen" id="fixopen" type="button" data-i18n="rv.fix">Other figure</button>
          <button class="act" id="skip" type="button" title="Next (→)" data-i18n-attr="title:rv.skipTitle">
            <span data-i18n="rv.skip">Skip</span> <kbd>→</kbd>
          </button>
          <p id="err" role="alert" style="flex-basis: 100%; margin: 0"></p>
        </div>

        <div id="side">
          <button class="act sheetclose" id="fixclose" type="button" data-i18n="rv.close">Close</button>
          <section class="card" id="fix" aria-label="Pick the figure" data-i18n-attr="aria-label:rv.pick">
            <h2 data-i18n="rv.notRight">Not right? Pick the figure</h2>
            <div id="cands"></div>
            <div class="builder" id="builder">
              <span class="lab" data-i18n="picker.somersaults">Somersaults</span>
              <div class="chips" data-field="s"></div>
              <span class="lab" id="dirlab" data-i18n="picker.direction">Direction</span>
              <div class="chips" data-field="d"></div>
              <span class="lab" data-i18n="picker.twists">Twists</span>
              <div class="chips" data-field="t"></div>
              <span class="lab" data-i18n="picker.position">Position</span>
              <div class="chips" data-field="p"></div>
            </div>
            <button class="act" id="savepick" type="button"></button>
          </section>
          <input
            id="note"
            type="text"
            placeholder="Note about this jump (optional)"
            aria-label="Note"
            data-i18n-attr="placeholder:rv.note;aria-label:rv.noteAria"
          />
          <details class="card" id="debugbox">
            <summary class="muted" data-i18n="rv.debug">Debug</summary>
            <pre id="debug"></pre>
          </details>
        </div>
      </div>
    </main>
    <div id="toast" role="status" hidden></div>

    <script type="module" src="/src/reviewPage/main.js"></script>
  </body>
</html>
