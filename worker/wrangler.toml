name = "trampovision-review"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "trampovision-review"
database_id = "2a8180dc-5ef3-4013-8764-dcb15c614282"

[observability]
enabled = true

[vars]
# The origin of the app: the only one the browser may call from.
ALLOWED_ORIGIN = "https://trampo-vision.vercel.app"
# The preview deployments of the app (one origin per branch and per commit), as a regular expression for the whole origin.
# They reach the same data as the app: remove this line to keep previews out.
PREVIEW_ORIGIN_PATTERN = 'https://trampo-vision-[a-z0-9-]+-erwann-robins-projects\.vercel\.app'

# Secrets (wrangler secret put):
#   INGEST_TOKEN  bearer token the app sends. It ships in the app bundle, so it only keeps strangers from writing by accident.
#   REVIEW_TOKEN  bearer token of the reviewers. Put Cloudflare Access in front of /review and /admin as well.
